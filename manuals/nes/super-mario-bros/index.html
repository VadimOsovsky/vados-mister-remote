#mario-book{--paper:#fffcf3;--ink:#24221d;--gold:#ffba32;--soft:#fff0c9;--display:"Manual Condensed","Arial Narrow","Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif;color:var(--ink);background:var(--paper);font:16px/1.7 Arial,"Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif;padding:clamp(18px,4vw,46px);box-sizing:border-box;max-width:980px;margin:auto}
#mario-book *{box-sizing:border-box}
#mario-book .toolbar{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding-bottom:18px;border-bottom:3px double var(--ink)}
#mario-book .brand{font:700 14px/1.2 var(--display);letter-spacing:1.8px}
#mario-book .languages{display:flex;gap:0;flex-wrap:wrap;border:1px solid var(--ink)}
#mario-book button{font:700 13px/1.2 var(--display);padding:11px 15px;border:0;border-right:1px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:0;cursor:pointer;min-height:44px}
#mario-book button:last-child{border-right:0}
#mario-book button[aria-pressed=true]{background:var(--gold);box-shadow:inset 0 -3px var(--ink)}
#mario-book button:hover{background:var(--soft)}
#mario-book .hero{display:grid;grid-template-columns:1.12fr 1fr;gap:30px;align-items:center;margin:22px calc(-1 * clamp(18px,4vw,46px)) 30px;padding:30px clamp(18px,4vw,46px);background:var(--gold);border-top:6px solid var(--ink);border-bottom:3px solid var(--ink)}
#mario-book .eyebrow{font:700 14px/1.3 var(--display);letter-spacing:2px;border-bottom:1px solid var(--ink);padding-bottom:10px}
#mario-book h1{font:700 clamp(36px,6.5vw,66px)/.98 var(--display);margin:16px 0 20px;letter-spacing:-1.5px;overflow-wrap:anywhere}
#mario-book:lang(ja) h1{font-size:clamp(29px,4.8vw,48px);line-height:1.18;letter-spacing:-1px;font-weight:900}

const titles=[tr('ものがたり','The story','История'),tr('コントローラー','Controls','Управление'),tr('遊び方','How to play','Как играть'),tr('パワーアップ','Power-ups','Усиления'),tr('登場キャラクター','Characters','Персонажи'),tr('テクニック','Techniques','Приёмы'),tr('使用上の注意','Taking care','Меры предосторожности')];
const story=tr('平和なキノコ王国は、大魔王クッパの一族に侵略されました。魔法で姿を変えられたキノコたちを救えるのはピーチ姫だけ。しかし姫もクッパに捕らわれています。マリオはカメ一族を倒し、姫と王国を救う冒険に出ます。','The peaceful Mushroom Kingdom has been invaded by Bowser and his tribe. Its people have been transformed by magic, and only Princess Peach can undo the spell. But she too is a prisoner. Mario sets out to defeat the invaders, rescue the princess and restore peace.','Мирное Грибное королевство захватил Боузер со своим войском. Его магия превратила жителей в камни, кирпичи и растения. Снять заклятие может только принцесса Пич, но и она в плену. Марио отправляется победить захватчиков, спасти принцессу и вернуть королевству мир.');
const controls=[['← →',tr('左右に移動。','Move left or right.','Движение влево и вправо.')],['↓',tr('スーパーマリオのときにしゃがむ。土管の上で押すと入れることも。','Crouch as Super Mario. On certain pipes, press down to enter.','Пригнуться в форме Супер Марио. Стоя на некоторых трубах, можно спуститься внутрь.')],['A',tr('ジャンプ。押す長さで高さが変わる。水中では押すたびに泳ぐ。','Jump; hold longer to jump higher. Press repeatedly to swim underwater.','Прыжок: чем дольше держишь, тем выше прыгаешь. Под водой каждое нажатие помогает плыть.')],['B',tr('移動中に押すとダッシュ。ファイアマリオはファイアボールを投げる。','Hold while moving to run. As Fire Mario, throw fireballs.','Удерживай при движении, чтобы бежать. В форме Огненного Марио — бросать огненные шары.')],['SELECT',tr('タイトル画面で1人用・2人用を選ぶ。','Choose a one-player or two-player game on the title screen.','Выбор игры для одного или двух игроков на титульном экране.')],['START',tr('ゲーム開始。プレイ中は一時停止・再開。','Start the game. During play, pause or resume.','Начать игру. Во время игры — пауза и продолжение.')]];
const ruleHead=[tr('8つのワールド','Eight worlds','Восемь миров'),tr('スタートとタイム','Starting out & time','Старт и время'),tr('ゴール','The goal','Финиш'),tr('ミスについて','Losing a life','Потеря жизни')];
const rules=[tr('各ワールドは4つのエリアで構成されています。地上、地下、水中を進み、最後のお城を目指しましょう。画面は右へスクロールし、後戻りはできません。','Each world has four areas. Travel overground, underground and underwater to reach the castle. The screen scrolls to the right; you cannot go back.','В каждом мире четыре уровня. Путь ведёт по земле, под землёй и под водой к замку. Экран прокручивается вправо: вернуться назад нельзя.'),tr('タイムがなくなるとミス。エリアの途中まで進むと、中間地点から再開できる場合があります。お城は入り口から再開します。','Running out of time costs a life. If you have advanced far enough, you may restart at a midway point. Castle areas restart at the entrance.','Когда время заканчивается, теряется жизнь. Если пройти достаточно далеко, можно возродиться с промежуточной точки. В замке придётся начинать от входа.'),tr('旗のポールの高い位置につかまるほど高得点。残りタイムも得点になりますが、お城ではタイムボーナスはありません。','Grab the flagpole as high as possible for more points. Remaining time becomes bonus points, except in castle areas.','Чем выше схватишься за флагшток, тем больше очков. Оставшееся время тоже превращается в очки, кроме уровней в замке.'),tr('敵や火に触れる、穴や溶岩に落ちる、水中で沈む、タイムがなくなるとミスになります。スーパーマリオは一度ダメージを受けると小さくなります。','Enemy contact, fire, pits, lava, sinking underwater or running out of time can cost a life. Super Mario shrinks after taking a hit.','Столкновение с врагом или огнём, падение в пропасть или лаву, погружение за нижний край подводного уровня и истечение времени отнимают жизнь. Супер Марио после удара становится маленьким.')];
const items=[['mushroom',tr('スーパーキノコ','Super Mushroom','Супергриб'),tr('スーパーマリオに変身。レンガを壊せるようになります。','Become Super Mario and break brick blocks.','Превращает в Супер Марио и позволяет разбивать кирпичи.')],['flower',tr('ファイアフラワー','Fire Flower','Огненный цветок'),tr('ファイアマリオに変身。ファイアボールは連続2発まで。','Become Fire Mario. Up to two fireballs can be on screen at once.','Превращает в Огненного Марио. Одновременно можно выпустить два огненных шара.')],['star',tr('スーパースター','Super Star','Суперзвезда'),tr('一定時間無敵になり、体当たりで敵を倒せます。','Temporarily become invincible and defeat enemies by touching them.','Даёт временную неуязвимость: врагов можно побеждать касанием.')],['oneup',tr('1UPキノコ','1-Up Mushroom','Гриб 1-Up'),tr('マリオが1人増えます。','Gain an extra life.','Добавляет одну жизнь.')],['coin',tr('コイン','Coin','Монета'),tr('1枚200点。100枚集めると1UP。','200 points each. Collect 100 for an extra life.','200 очков за штуку. За 100 монет — дополнительная жизнь.')],['block',tr('？ブロック','? Block','Блок «?»'),tr('下からたたくと、コインやアイテムが出ます。見えないブロックも探してみましょう。','Hit from below to reveal coins or items. Look for hidden blocks too.','Ударь снизу, чтобы получить монету или предмет. Ищи и невидимые блоки.')]];

['koopa',tr('ノコノコ（緑）','Green Koopa Troopa','Зелёная Купа'),tr('踏むと甲羅に入り、けると滑ります。','Stomp to hide it in its shell; kick the shell to send it sliding.','После прыжка прячется в панцирь. Толкни панцирь, чтобы отправить его скользить.'),'100'],

['redpara',tr('パタパタ（赤）','Red Koopa Paratroopa','Красная Паракупа'),tr('上下に飛びます。踏むと羽が取れます。','Flies up and down. Stomp to remove its wings.','Летает вверх и вниз. Прыжок сверху сбивает крылья.'),'400'],

['hammer',tr('ハンマーブロス','Hammer Bro','Хаммер Бро'),tr('跳びながらハンマーを投げます。','Jumps while throwing hammers.','Прыгает и бросает молотки.'),'1000'],
['lakitu',tr('ジュゲム','Lakitu','Лакиту'),tr('雲の上からパイポを落とします。','Drops Spiny eggs from a cloud.','Сбрасывает яйца Спайни из облака.'),'200'],
['spiny',tr('トゲゾー','Spiny','Спайни'),tr('トゲがあるので踏んではいけません。','Its spikes make it unsafe to stomp.','Из-за шипов на него нельзя прыгать сверху.'),'200'],
['plant',tr('パックンフラワー','Piranha Plant','Растение-пиранья'),tr('土管から現れます。上から踏めません。','Emerges from pipes. Do not jump on it.','Появляется из труб. Прыгать сверху нельзя.'),'200'],
['fish',tr('プクプク','Cheep Cheep','Чип-чип'),tr('水中を泳ぎ、場所によっては水面から飛び出します。','Swims underwater; some leap out of the water.','Плавает под водой; некоторые выпрыгивают над поверхностью.'),'200'],
['blooper',tr('ゲッソー','Blooper','Блупер'),tr('水中でマリオを追いかけます。','Chases Mario underwater.','Преследует Марио под водой.'),'200'],
['bullet',tr('キラー','Bullet Bill','Билл-пуля'),tr('まっすぐ飛んできます。上から踏めます。','Flies straight ahead. Can be stomped.','Летит по прямой. Можно победить прыжком сверху.'),'200'],
['podoboo',tr('バブル','Podoboo','Подобу'),tr('お城の溶岩から飛び出す火の玉です。','A fireball that leaps out of castle lava.','Огненный шар, выскакивающий из лавы в замках.'),''],
['bowser',tr('大魔王クッパ','Bowser','Боузер'),tr('お城の奥で待ち受ける敵。背後の斧を目指しましょう。','Waits at the end of the castle. Try to reach the axe behind him.','Ждёт в конце замка. Постарайся добраться до топора за его спиной.'),''],
['toad',tr('キノピオ','Toad','Тоад'),tr('各ワールドのお城に捕らわれたキノコ王国の住人。','A Mushroom Kingdom resident held captive in the castles.','Житель Грибного королевства, пленник в замках.'),''],

function render(lang){if(!['ja','en','ru'].includes(lang))lang='ru';root.lang=lang;document.documentElement.lang=lang;document.title={ja:'スーパーマリオブラザーズ · 取扱説明書',en:'Super Mario Bros. · Instruction booklet',ru:'Супер братья Марио · Руководство по игре'}[lang];const t=x=>x[lang],img=(key,cls='art',alt='')=>`<img class="${cls}" src="${assets[key]}" alt="${alt}">`,heading=i=>`<h2 id="m-heading-${i}"><span class="num">0${i+1}</span>${t(titles[i])}</h2>`;
content.innerHTML=`<div class="hero"><div><div class="eyebrow">SUPER MARIO BROS.</div><h1>${t(tr('スーパー<br>マリオブラザーズ','SUPER<br>MARIO BROS.','СУПЕР БРАТЬЯ<br>МАРИО'))}</h1><div class="subtitle">${t(tr('取扱説明書','Instruction booklet','Руководство по игре'))}</div><div class="edition">FAMILY COMPUTER · HVC-SM<br>${t(tr('取扱説明書 · ウェブ版','Instruction booklet · web edition','Инструкция к игре · веб-версия'))}</div></div>${img('cover','cover',t(tr('表紙イラスト','Original cover illustration','Иллюстрация с обложки')))}</div><div class="toc-heading">${t(tr('目次','Contents','Содержание'))}<span>HVC-SM</span></div><nav id="contents" aria-label="${t(tr('目次','Contents','Содержание'))}">${titles.map((x,i)=>`<a href="#m-section-${i}" data-number="0${i+1}">${t(x)}</a>`).join('')}</nav>
<section id="m-section-0" aria-labelledby="m-heading-0">${heading(0)}<div class="story">${t(story)}</div></section>
<section id="m-section-1" aria-labelledby="m-heading-1">${heading(1)}<div class="columns"><div>${img('controller','art',t(tr('ファミコンのコントローラー','Famicom controller','Контроллер Famicom')))}<div class="note small">${t(tr('1人用はⅠコントローラー。2人用は交代でプレイし、Ⅱコントローラーも使います。マイクは使いません。','Use controller I for one player. In two-player mode, take turns using controllers I and II. The microphone is not used.','Для одного игрока используется контроллер I. Вдвоём играют по очереди с контроллерами I и II. Микрофон не используется.'))}</div></div><div class="controls">${controls.map(([key,x])=>`<kbd>${key}</kbd><div class="control-text">${t(x)}</div>`).join('')}</div></div></section>
<section id="m-section-2" aria-labelledby="m-heading-2">${heading(2)}<div class="scene">${img('world','art',t(tr('4つのエリア','Four areas in a world','Четыре уровня одного мира')))}</div><div class="columns game-rules" style="margin-top:24px">${rules.map((x,i)=>`<div><h3>${t(ruleHead[i])}</h3>${i===2?`<div class="goal-copy"><p>${t(x)}</p>${img('flag','flag-art',t(tr('旗のポール','Flagpole','Флагшток')))}</div>`:`<p>${t(x)}</p>`}</div>`).join('')}</div></section>

<footer><p>© 1985 Nintendo · ${t(tr('原本をもとに内容を再構成した非公式ウェブ版。','Unofficial web edition adapted from the original instruction booklet.','Неофициальная веб-версия по материалам оригинальной инструкции.'))}</p><a href="https://www.nintendo.co.jp/clv/manuals/ja/pdf/CLV-P-HAAAJ.pdf" target="_blank" rel="noopener noreferrer">${t(tr('日本語の原本 PDF','Original Japanese PDF','Оригинальный PDF на японском'))} ↗</a><a class="back-to-contents" href="#contents">↑ ${t(tr('目次へ','Back to contents','К оглавлению'))}</a></footer>`;
root.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang)));updateContentsVisibility();}
function updateContentsVisibility(){
  const contents=root.querySelector('#contents');
  const button=root.querySelector('.back-to-contents');
  if(contents&&button)button.hidden=contents.getBoundingClientRect().bottom>0;
}
window.addEventListener('scroll',updateContentsVisibility,{passive:true});
window.addEventListener('resize',updateContentsVisibility);
document.fonts.ready.then(updateContentsVisibility);
root.querySelectorAll('[data-lang]').forEach(button=>button.addEventListener('click',()=>{
  const lang=button.dataset.lang;
  render(lang);
  const url=new URL(location.href);
  url.searchParams.set('lang',lang);
  try { history.replaceState(null,'',url.href); } catch { /* Language still works in restricted file viewers. */ }
}));
const requestedLanguage=new URL(location.href).searchParams.get('lang');
render(['ja','en','ru'].includes(requestedLanguage)?requestedLanguage:'ru');
// Content is generated before resolving an incoming deep link; wait for the
// embedded font so the target's final position is correct on a direct visit.
if(location.hash)document.fonts.ready.then(()=>{
  let id;try{id=decodeURIComponent(location.hash.slice(1));}catch{return;}
  const target=document.getElementById(id);
  if(target)target.scrollIntoView({behavior:'instant',block:'start'});
});
})();
</script>
