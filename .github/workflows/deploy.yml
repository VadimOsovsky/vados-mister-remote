name: Deploy Playroom and manuals to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manuals-pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
      - name: Test manual publishing and cache revisions
        run: node --test tests/manuals.test.mjs
      - name: Install app dependencies
        run: |
          corepack enable
          yarn install --frozen-lockfile --non-interactive
      - name: Build LaunchBox catalog
        run: yarn build-library
      - name: Build Playroom for Pages
        env:
          VITE_PAGES_BASE: /${{ github.event.repository.name }}/app/
          VITE_PAGES_BUILD: ${{ github.run_number }}.${{ github.run_attempt }}
          VITE_WIZZO_ADDRESS: https://mister-playroom.duckdns.org
          VITE_PLAYROOM_API_ORIGIN: ${{ vars.VITE_PLAYROOM_API_ORIGIN || 'https://mister-playroom.duckdns.org' }}
        run: yarn build
      - name: Build manuals
        run: node scripts/build-manuals.mjs
      - name: Combine site files
        run: mv dist manuals-dist/app
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: manuals-dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy manuals
        id: deployment
        uses: actions/deploy-pages@v4
